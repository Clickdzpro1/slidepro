name: Build and Push SlidePro Image

# Builds the SlidePro (presenton fork) image and pushes it to GHCR + VCR.
# Triggers: push to main (image build), manual dispatch, and on tag (versioned release).
# VCR (Vercel Container Registry) is the primary registry for Sandbox boot —
# GHCR is kept as a legacy/fallback. VCR requires zstd compression + linux/amd64.
on:
  push:
    branches: [main]
    paths:
      - "servers/**"
      - "Dockerfile"
      - "nginx.conf"
      - "templates/**"
      - "layouts.json"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VCR_REGISTRY: vcr.vercel.com
  VCR_IMAGE: clickdz/slidepro-proxy/presenton

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to VCR (Vercel Container Registry)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.VCR_REGISTRY }}
          username: ${{ secrets.VERCEL_TEAM_ID }}
          password: ${{ secrets.VERCEL_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # GHCR push — standard gzip compression, both :latest and :sha-XXXX tags
      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # VCR push — zstd compression, linux/amd64 only (VCR requirement)
      # Uses buildx --output with compression=zstd to stay under the 500MB/layer limit
      - name: Build and push to VCR (zstd)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: |
            type=image,name=${{ env.VCR_REGISTRY }}/${{ env.VCR_IMAGE }}:latest,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=gha

      # Tag the VCR :latest image as :sha-XXXX for immutable rollouts
      - name: Tag VCR sha tag
        run: |
          docker buildx imagetools create \
            ${{ env.VCR_REGISTRY }}/${{ env.VCR_IMAGE }}:latest \
            ${{ env.VCR_REGISTRY }}/${{ env.VCR_IMAGE }}:sha-${{ steps.sha.outputs.short }}
